<style>
:root{color-scheme:light;--paper:#f6f0e3;--sheet:#fffaf0;--ink:#28291f;--muted:#615d4f;--rule:#d9ceb9;--green:#314d39;--tint:#e9edde;--serif:Georgia,"Songti SC","SimSun",serif;--sans:system-ui,"Microsoft YaHei",sans-serif}

.shell{width:min(100% - 64px,1380px);margin-inline:auto}.top{border-bottom:1px solid var(--rule);background:#f9f4e9}.top-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:inline-flex;align-items:center;gap:11px;font:700 22px/1.1 var(--serif);flex:none}.mark{position:relative;flex:none;overflow:hidden;border:1px solid #60735b;border-radius:50%;background:#e7ecdc;color:#2e4937;width:38px;height:38px}
.mark-star{position:absolute;display:grid;place-items:center;inset:0;font:22px/1 var(--serif);animation:star-pulse 2.6s ease-in-out infinite}
@keyframes star-pulse{0%,100%{transform:scale(.82)}50%{transform:scale(1.23)}}
.mark-bunny{position:absolute;isolation:isolate;top:18%;left:calc(50% - 4px);width:8px;height:5.5px;border:1px solid #47614d;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 29% 48%,#344b3a 0 .55px,transparent .75px),radial-gradient(circle at 71% 48%,#344b3a 0 .55px,transparent .75px),radial-gradient(circle at 50% 71%,#b66666 0 .45px,transparent .6px),#fff9ec;animation:bunny-run 1.8s linear infinite}
.mark-bunny::before,.mark-bunny::after{content:'';position:absolute;z-index:-1;bottom:78%;width:32%;height:120%;border:1px solid #47614d;border-radius:65% 65% 50% 50%;background:#efc7c0;transform-origin:bottom center}
.mark-bunny::before{left:8%;transform:rotate(-13deg)}
.mark-bunny::after{right:8%;transform:rotate(13deg)}
@keyframes bunny-run{
  0%,100%{transform:translate(-6px,0)}
  12.5%,87.5%{transform:translate(-3px,-1.4px)}
  25%,75%{transform:translate(0,0)}
  37.5%,62.5%{transform:translate(3px,-1.4px)}
  50%{transform:translate(6px,0)}

.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,390px);align-items:end;gap:25px;margin:34px 0 24px}.intro h1{font:700 clamp(42px,6vw,82px)/1.04 var(--serif);letter-spacing:-.055em;margin:0 0 9px;color:#27382b}.intro p{margin:0;color:var(--muted);max-width:60ch}.search{min-height:47px;display:flex;align-items:center;gap:10px;padding:0 13px;background:var(--sheet);border:1px solid #bfb39a;border-radius:8px}.search:focus-within{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.search input{border:0;background:none;outline:none;min-width:0;width:100%;padding:11px 0}.search input::placeholder{color:#676153}.search span{font-size:23px;line-height:1;color:var(--green)}
[hidden]{display:none!important}
.launch{margin-top:22px}
.launch-cover{
  --scene-x:.56;
  --scene-y:.53;
  position:relative;isolation:isolate;display:flex;align-items:center;min-height:clamp(500px,73vh,720px);
  overflow:hidden;border-radius:13px;background:#17281f;color:#fff4d8
}
.cover-scene{position:absolute;inset:0;container-type:size;pointer-events:none}
.cover-frame{
  --scene-width:max(100cqw,150cqh);
  --scene-height:max(100cqh,66.666667cqw);
  position:absolute;width:var(--scene-width);height:var(--scene-height);
  left:calc((100cqw - var(--scene-width))*var(--scene-x));
  top:calc((100cqh - var(--scene-height))*var(--scene-y))
}
.cover-image{display:block;width:100%;height:100%}
.cover-frame::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#111d17e8 1%,#111d17bb 31%,#111d1730 62%,transparent 86%)}
.cover-content{position:relative;z-index:2;pointer-events:none;padding:clamp(30px,6.5vw,104px);max-width:690px}
.cover-content a{pointer-events:auto}
.portal-enter{
  position:absolute;left:57.2%;top:24.2%;width:28.3%;height:40%;
  display:grid;place-items:center;padding:0;
  border:0;border-radius:50%;clip-path:ellipse(50% 50%);background:transparent;
  color:#fff5d6;pointer-events:auto;touch-action:manipulation;isolation:isolate
}
.portal-enter::before,.portal-enter::after{content:'';position:absolute;inset:1%;border-radius:50%;pointer-events:none}
.portal-enter::before{
  background:radial-gradient(ellipse at 50% 44%,#ffe8ab20 0%,transparent 48%,#ffd88150 100%);
  box-shadow:inset 0 0 20px #ffe2a6cc,inset 0 0 3px 2px #fff1cc;
  animation:portal-breathe 4.4s ease-in-out infinite alternate
}
.portal-enter::after{inset:5%;border:1px solid transparent}
.portal-enter:is(:hover,:focus-visible)::after{border-color:#fff0be;box-shadow:0 0 11px #ffe6a6,inset 0 0 11px #ffe6a6a3}
.portal-caption{
  position:absolute;bottom:13%;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:5px 10px;border:1px solid #ffe6a1a8;border-radius:999px;
  color:#fff5d6;background:#28372cf2;font-size:clamp(11px,1.1vw,15px);font-weight:650;white-space:nowrap
}
.portal-enter:is(:hover,:focus-visible) .portal-caption{background:#fff0be;color:#24382a;border-color:#fff0be}
.cover-sparks{position:absolute;inset:0;pointer-events:none}
.cover-sparks i{
  position:absolute;left:var(--x);top:var(--y);width:var(--size,3px);height:var(--size,3px);
  border-radius:50%;background:#fff0b3;box-shadow:0 0 7px 2px #f4d16f80;
  animation:cover-spark var(--duration,6s) var(--delay,0s) ease-in-out infinite
}
@keyframes portal-breathe{from{opacity:.28}to{opacity:.79}}
@keyframes cover-spark{
  0%,100%{opacity:.13;transform:translate(0,8px) scale(.65)}
  50%{opacity:.83;transform:translate(var(--drift,8px),-12px) scale(1.05)}
}
@media(prefers-reduced-motion:reduce){
  .portal-enter::before,.cover-sparks i{animation:none;opacity:.45}
}
.cover-content h1{font:700 clamp(57px,9vw,132px)/.98 var(--serif);letter-spacing:-.055em;margin:0 0 18px}
.cover-content p{font-size:clamp(15px,1.65vw,22px);line-height:1.65;max-width:35ch;margin:0 0 28px;color:#f0e3c7;text-wrap:pretty}
.cover-content :focus-visible{outline-color:#fff4d8}
.launch-link,.launch-enter{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:46px;padding:10px 17px;font-weight:650;border:1px solid #e8d2a0;border-radius:6px}
.launch-link{background:#17281fd9;color:#fff4d8}
.launch-link:hover{background:#2c4333}
.launch-section{padding:clamp(44px,7vw,92px) 0;border-bottom:1px solid var(--rule)}
.launch-section h2,.launch-end h2{font:700 clamp(28px,4.5vw,55px)/1.12 var(--serif);color:var(--green);letter-spacing:-.025em;margin:0 0 13px;text-wrap:balance}
.launch-section p,.launch-end p{color:var(--muted);max-width:62ch;margin:0;line-height:1.65;text-wrap:pretty}
.launch-feature{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:center;gap:clamp(24px,6vw,80px)}
.launch-figure{margin:0;border:1px solid #bfb39a;border-radius:9px;overflow:hidden;background:#ebd8b2}
.launch-figure img{display:block;width:100%;height:auto}
.launch-notes{list-style:none;display:grid;gap:10px;padding:0;margin:18px 0 0;color:#3a503d;font-size:14px;font-weight:600}
.launch-notes li{display:flex;gap:8px;align-items:baseline}
.launch-notes li::before{content:'✧';color:#496750}
.section-guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0 0;padding:0;list-style:none}
.section-guide li{border:1px solid var(--rule);border-radius:8px;padding:16px;background:var(--sheet)}
.section-guide strong{display:flex;align-items:center;gap:9px;color:var(--green);line-height:1.3;font-size:16px}
.guide-icon{display:grid;place-items:center;flex:none;width:27px;height:27px;background:var(--tint);border-radius:5px;font-size:17px}
.section-guide p{font-size:13px;margin-top:9px;line-height:1.5}.guide-categories{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}.guide-categories span{background:#f1ead9;border-radius:4px;padding:2px 6px;color:#4b5441;font-size:11px}
.launch-end{text-align:center;padding:clamp(44px,7vw,87px) 18px 34px}
.launch-end p{margin:0 auto 19px}
.launch-enter{color:#fffaf0;background:var(--green);border-color:var(--green)}
.launch-enter:hover{background:#416048}
@media(max-width:730px){
  .launch{margin-top:13px}
  .launch-cover{--scene-x:.84;--scene-y:.5;align-items:end;min-height:510px}
  .cover-frame::before{background:linear-gradient(0deg,#101b15fa 1%,#101b15c5 35%,#101b151c 72%,transparent)}
  .cover-content{padding:24px}
  .cover-content h1{margin-bottom:10px}
  .cover-content p{margin-bottom:16px}
  .launch-feature{grid-template-columns:1fr;gap:18px}
  .section-guide{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .section-guide li{padding:11px}
  .section-guide strong{font-size:14px;gap:5px}
  .section-guide p{font-size:12px}
}
.atlas{display:grid;grid-template-columns:minmax(0,1.57fr) minmax(0,1fr);align-items:start;gap:20px}.map-sheet,.panel{border:1px solid #bfb39a;border-radius:11px;background:var(--sheet);overflow:hidden;box-shadow:0 3px 0 #6b51240c}.map-sheet{position:sticky;top:16px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 15px;background:#f1ead9;border-bottom:1px solid var(--rule)}.sheet-head h2{margin:0;font:700 19px var(--serif);color:#394533}.sheet-head span{color:#625c4c;font-size:12px;text-align:right}
.map{position:relative;isolation:isolate;aspect-ratio:3/2;background:#eee2c7}.map img{position:absolute;width:100%;height:100%;object-fit:fill;inset:0}.hotspots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.hotspot{position:relative;min-width:0;display:flex;align-items:end;justify-content:center;padding:0 2px 8%;border:1px solid transparent;background:transparent}.hotspot span{max-width:100%;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;color:#303225;background:#fffaf0;border:1px solid #8b806b;border-radius:6px;box-shadow:0 2px 4px #392a1820;font-size:clamp(11px,1.05vw,15px);font-weight:650;text-wrap:balance;line-height:1.23}.hotspot b{color:#3c5b40}.hotspot:hover,.hotspot[aria-pressed=true]{background:#fffaf02b}.hotspot:hover span,.hotspot[aria-pressed=true] span{color:#fffaf0;background:var(--green);border-color:var(--green)}.hotspot:hover b,.hotspot[aria-pressed=true] b{color:inherit}.hotspot:focus-visible{outline-offset:-5px}
.map-note{padding:10px 15px;color:var(--muted);font-size:12px;border-top:1px solid var(--rule);background:#f9f3e7}
.panel{min-height:420px}.crumb{min-height:43px;padding:8px 15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#f1ead9;border-bottom:1px solid var(--rule);font-size:12px;color:#4d5944}.crumb button{border:0;border-radius:4px;background:transparent;padding:4px 5px;text-align:left}.crumb button:hover{text-decoration:underline}.crumb [aria-current]{font-weight:700;padding:4px 3px}.panel-body{padding:17px 17px 19px}.panel-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:13px}.panel-title h2{margin:0;font:700 clamp(22px,2.2vw,32px)/1.15 var(--serif);color:#303e2e;overflow-wrap:anywhere}.count{font-size:11px;color:var(--muted);flex:none;text-align:right}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.category{display:flex;align-items:center;min-width:0;gap:6px;padding:9px 7px;border:1px solid var(--rule);border-radius:6px;background:#f9f3e6;text-align:left;font-size:12px;line-height:1.25}.category:hover,.category[aria-current=page]{background:var(--tint);border-color:#b1b9a3}.category .symbol{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:4px;color:#39523c;background:#e9eddf;font-size:16px}.category .label{flex:1;overflow-wrap:anywhere}.category .arrow{color:#52644e}.panel-tools{margin-top:13px}
.resource-list{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--rule)}.resource{display:flex;gap:5px;align-items:center;border-bottom:1px solid var(--rule);min-width:0}.resource a{flex:1;display:flex;gap:9px;align-items:start;min-width:0;padding:10px 0}.resource a:hover strong{text-decoration:underline;text-underline-offset:3px}.resource-text{min-width:0;flex:1}.resource strong{display:block;font-size:14px;line-height:1.28;overflow-wrap:anywhere}.resource p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.4;overflow-wrap:anywhere}.domain{display:block;color:#626453;font-size:10px;line-height:1.35;margin-top:3px;overflow-wrap:anywhere}.tile{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:#324932;background:#e9edde;font-weight:750;font-size:11px}.tile img{display:block;width:23px;height:23px;object-fit:contain}.resource .external{color:#5a6952;margin:0 2px 0 auto;font-size:14px}.favorite{flex:none;border:0;border-radius:6px;background:transparent;color:#6c6453;font-size:21px;width:34px;height:36px;line-height:1}.favorite:hover,.favorite[aria-pressed=true]{color:#835619;background:#f2e7ce}.empty{color:var(--muted);padding:15px 0}.more{display:block;margin:13px auto 0}.more[hidden]{display:none}.footer{margin:21px 0 0;padding:14px 0 22px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}
@media(max-width:960px){.shell{width:calc(100% - 36px)}.atlas{gap:13px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.panel-body{padding:14px}.intro{margin-top:26px}}
@media(max-width:730px){.shell{width:calc(100% - 28px)}.top-inner{min-height:57px;gap:5px}.brand{font-size:17px;gap:6px}.mark{width:32px;height:32px}.mark-star{font-size:19px}.top-actions{gap:5px}.control{padding-inline:8px;min-height:36px;font-size:13px}.favorite-top .action-text{display:none}.favorite-top{min-width:36px;justify-content:center;font-size:19px}.intro{display:block;margin:20px 0 13px}.intro h1{font-size:clamp(40px,10vw,60px);margin-bottom:5px}.intro p{font-size:13px}.search{margin-top:11px;min-height:41px}.search input{padding-block:8px}.atlas{grid-template-columns:1fr;gap:12px}.map-sheet{position:static}.sheet-head{padding:8px 10px}.sheet-head h2{font-size:16px}.sheet-head span,.map-note{font-size:10px}.map-note{padding:6px 10px}.hotspot{padding-bottom:6%}.hotspot span{padding:4px 5px;gap:3px;font-size:10px}.panel{min-height:0}.crumb{min-height:37px;padding:5px 9px}.panel-body{padding:12px}.panel-title h2{font-size:23px}}
</style>

  {id:'play',icon:'▷',label:['影视与游戏','Film & games','Cine y juegos'],groups:[1,7]},
  {id:'learn',icon:'▤',label:['阅读与学习','Read & learn','Lectura y estudio'],groups:[2,3]},
  {id:'create',icon:'✎',label:['软件与创作','Software & design','Software y diseño'],groups:[4,6]},
  {id:'tools',icon:'⊞',label:['实用与网络','Everyday tools','Herramientas'],groups:[8,9]},
  {id:'culture',icon:'◎',label:['地图与文化','Maps & culture','Mapas y cultura'],groups:[10,11]}
];
const copy = [
  {lang:'zh-CN',brand:'星门',intro:'在地图上探索资源，或直接搜索你想找的网站。',search:'搜索网站、用途或域名',map:'资源地图',note:'点击插画中的区域，打开相应分类。',browse:'浏览分类',all:'全部网站',favorites:'我的收藏',trail:'浏览路径',matches:'搜索结果',count:n=>n+' 个网站',empty:'没有找到符合条件的网站。',emptyFav:'点击网站旁的星标，即可在这里找到它。',save:'收藏',remove:'取消收藏',more:'显示更多',footer:'星门 · 三语网址导航'},
  {lang:'en',brand:'Stargate',intro:'Explore the map or search for a website, tool, or resource.',search:'Search sites, topics, or domains',map:'Resource map',note:'Select a place on the map to open its categories.',browse:'Browse categories',all:'All websites',favorites:'Favorites',trail:'Breadcrumbs',matches:'Search results',count:n=>n===1?'1 site':n+' sites',empty:'No websites match your search.',emptyFav:'Select a star next to any site to save it here.',save:'Save',remove:'Remove favorite',more:'Show more',footer:'Stargate · Trilingual web directory'},
  {lang:'es',brand:'Portal Estelar',intro:'Explora el mapa o busca un sitio, una herramienta o un recurso.',search:'Busca sitios, temas o dominios',map:'Mapa de recursos',note:'Selecciona un lugar del mapa para abrir sus categorías.',browse:'Explorar categorías',all:'Todos los sitios',favorites:'Favoritos',trail:'Ruta de navegación',matches:'Resultados de búsqueda',count:n=>n===1?'1 sitio':n+' sitios',empty:'No hay sitios que coincidan con tu búsqueda.',emptyFav:'Pulsa la estrella junto a un sitio para guardarlo aquí.',save:'Guardar',remove:'Quitar de favoritos',more:'Mostrar más',footer:'Portal Estelar · Directorio web trilingüe'}
];
const landingCopy = [
  {
    intro:'一张手绘地图，带你找到好用的工具、开放资源和世界各地的数字馆藏。',
    releaseLink:'了解新版',releaseTitle:'新版星门',
    releaseIntro:'点选地图上的建筑，右侧就会打开对应的栏目和网站。想直达某个资源，也可以搜索名称、用途或域名。',
    notes:['180 个网站，12 个栏目','简体中文、English、Español 随时切换','收藏保存在当前浏览器'],
    guideTitle:'地图上的六个区域',guideIntro:'每个区域连接两个栏目，点进去就能查看对应的网站。',
    guide:['AI 工具、编程文档与开发平台','影视动画、游戏与模组','电子书、公开课程与语言学习','开源软件、设计工具与创作素材','效率工具、网络测试与隐私','开放地图、公共数据与数字馆藏'],
    startTitle:'准备好出发了吗？',startIntro:'进入星门，打开资源地图和搜索。',enter:'探索世界'
  },
  {
    intro:'A hand-illustrated map to useful tools, open resources, and digital collections around the world.',
    releaseLink:'See what’s new',releaseTitle:'What’s new in Stargate',
    releaseIntro:'Select a landmark to open its categories and websites in the directory panel. To go straight to a resource, search by name, topic, or domain.',
    notes:['180 websites in 12 categories','Switch between English, 简体中文, and Español','Favorites saved in your browser'],
    guideTitle:'Six places to explore',guideIntro:'Each place leads to two categories and their website listings.',
    guide:['AI tools, coding docs, and development platforms','Film, animation, games, and mods','Ebooks, open courses, and language learning','Open-source apps, design tools, and creative assets','Productivity, network testing, and privacy','Open maps, public data, and digital collections'],
    startTitle:'Ready to explore?',startIntro:'Open the map and search the directory.',enter:'Explore the world'
  },
  {
    intro:'Un mapa ilustrado para descubrir herramientas útiles, recursos abiertos y colecciones digitales de todo el mundo.',
    releaseLink:'Ver las novedades',releaseTitle:'Novedades de Portal Estelar',
    releaseIntro:'Selecciona un edificio para ver sus categorías y sitios en el panel. Si buscas un recurso concreto, escribe su nombre, tema o dominio.',
    notes:['180 sitios en 12 categorías','Cambia entre español, English y 简体中文','Tus favoritos se guardan en el navegador'],
    guideTitle:'Seis lugares por explorar',guideIntro:'Cada lugar te lleva a dos categorías y a sus sitios web.',
    guide:['Herramientas de IA, documentación y plataformas de desarrollo','Cine, animación, juegos y mods','Libros digitales, cursos abiertos e idiomas','Software libre, diseño y recursos creativos','Productividad, pruebas de red y privacidad','Mapas abiertos, datos públicos y colecciones digitales'],
    startTitle:'¿Todo listo para explorar?',startIntro:'Abre el mapa y busca en el directorio.',enter:'Explorar el mundo'
  }
];
const get = id => document.getElementById(id);
get('landingArt').src = get('illustration').src;
const normalize = value => value.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');
const records = catalog.map((group,index) => group.entries.map(([name,host,...descriptions]) => {
  const href = new URL('https://'+host);
  const region = regions.find(item=>item.groups.includes(index));
  return {
    name,host,descriptions,href:href.href,domain:href.hostname.replace(/^www\./,''),
    initials:Array.from(name.replace(/[^\p{L}\p{N}]/gu,'')).slice(0,2).join('').toUpperCase(),
    searchable:normalize([name,host,...descriptions,...group.label,...region.label].join(' '))
  };
}));
const all = records.flat();
function read(key, fallback) {
  try { return JSON.parse(localStorage.getItem('stargate.'+key)) ?? fallback; }
  catch { return fallback; }
}
function persist(key,value) {
  try { localStorage.setItem('stargate.'+key,JSON.stringify(value)); }
  catch { /* Browsing still works with storage disabled. */ }
}
const defaultLanguage = 1;
const savedLanguage = Number(read('lang',defaultLanguage));
let language = copy[savedLanguage] ? savedLanguage : defaultLanguage;
const savedFavorites = read('favorites',[]);
const favorites = new Set(Array.isArray(savedFavorites) ? savedFavorites : []);
const routes = new Set(['landing','home','all','favorites',...regions.map(region=>region.id),...catalog.map((_,index)=>'category-'+index)]);
function routeFromHash() {
  const hash = location.hash.slice(1);
  return routes.has(hash) ? hash : 'landing';
}
let view = routeFromHash();
const pageSize = 12;
let rendered = 0;
let matching = [];
let pendingSearch = 0;
const entriesByHost = new Map(all.map(record=>[record.host,record]));
const t = () => copy[language];

function el(tag,className,value) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (value !== undefined) node.textContent = value;
  return node;
}
function action(label,route,className) {
  const button = el('button',className,label);
  button.type = 'button';
  button.dataset.route = route;
  return button;
}
function tokens() {
  return normalize(get('search').value.trim()).split(/\s+/).filter(Boolean);
}
function context() {
  const index = view.startsWith('category-') ? Number(view.slice(9)) : null;
  const region = index === null ? regions.find(item=>item.id===view) : regions.find(item=>item.groups.includes(index));
  return {index,region};
}
function renderMap() {
  const {region} = context();
  get('hotspots').replaceChildren(...regions.map(item=>{
    const button = action(undefined,item.id,'hotspot');
    button.setAttribute('aria-pressed',String(region===item));
    const symbol = el('b','',item.icon);
    symbol.setAttribute('aria-hidden','true');
    const text = el('span');
    text.append(symbol,item.label[language]);
    button.append(text);
    return button;
  }));
}
function syncMap() {
  const {region} = context();
  for (const button of get('hotspots').children) button.setAttribute('aria-pressed',String(button.dataset.route===region?.id));
  const active = view==='favorites';
  get('favorites').setAttribute('aria-current',active?'page':'false');
  get('favorites').firstElementChild.textContent = active?'★':'☆';
}
function renderBreadcrumb(title,searching) {
  const nav = get('breadcrumb');
  const {index,region} = context();
  nav.replaceChildren();
  if (view==='home' && !searching) {
    const home = el('span','',t().map);
    home.setAttribute('aria-current','page');
    nav.append(home);
    return;
  }
  nav.append(action(t().map,'home'));
  if (region && index!==null && !searching) nav.append(el('span','','/'),action(region.label[language],region.id));
  const current = el('span','',title);
  current.setAttribute('aria-current','page');
  nav.append(el('span','','/'),current);
}
function categoryPicker(indices) {
  const picker = el('div','categories');
  for (const index of indices) {
    const group = catalog[index];
    const button = action(undefined,'category-'+index,'category');
    if (view===button.dataset.route) button.setAttribute('aria-current','page');
    const icon = el('span','symbol',group.icon);
    const arrow = el('span','arrow','›');
    icon.setAttribute('aria-hidden','true');
    arrow.setAttribute('aria-hidden','true');
    button.append(icon,el('span','label',group.label[language]),arrow);
    picker.append(button);
  }
  return picker;
}
function updateFavoriteButton(button,record) {
  const saved = favorites.has(record.host);
  button.textContent = saved ? '★' : '☆';
  button.setAttribute('aria-pressed',String(saved));
  button.title = (saved?t().remove:t().save)+' · '+record.name;
  button.setAttribute('aria-label',button.title);
}
function resource(record) {
  const item = el('li','resource');
  const link = el('a');
  link.href = record.href;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  const tile = el('span','tile');
  const icon = siteIcons[record.host];
  if (icon) {
    const image = el('img');
    image.alt = '';
    image.width = 23;
    image.height = 23;
    image.loading = 'lazy';
    image.decoding = 'async';
    image.addEventListener('error',()=>{ tile.textContent = record.initials; },{once:true});
    image.src = 'data:image/webp;base64,' + icon;
    tile.append(image);
  } else {
    tile.textContent = record.initials;
  }
  tile.setAttribute('aria-hidden','true');
  const info = el('div','resource-text');
  info.append(el('strong','',record.name),el('p','',record.descriptions[language]),el('span','domain',record.domain));
  const external = el('span','external','↗');
  external.setAttribute('aria-hidden','true');
  link.append(tile,info,external);
  const button = el('button','favorite');
  button.type = 'button';
  button.dataset.favorite = record.host;
  updateFavoriteButton(button,record);
  item.append(link,button);
  return item;
}
function appendPage() {
  const list = get('resourceList');
  const next = matching.slice(rendered,rendered+pageSize).map(resource);
  list.append(...next);
  rendered += next.length;
  const more = get('more');
  more.hidden = rendered>=matching.length;
  return next[0];
}
function renderResults() {
  const query = tokens();
  const searching = query.length>0;
  const {index,region} = context();
  let title = t().browse;
  let entries = all;
  let indices = [];
  if (searching) {
    title = t().matches;
    entries = (view==='favorites'?all.filter(record=>favorites.has(record.host)):all)
      .filter(record=>query.every(word=>record.searchable.includes(word)));
  } else if (view==='favorites') {
    title = t().favorites;
    entries = all.filter(record=>favorites.has(record.host));
  } else if (index!==null) {
    title = catalog[index].label[language];
    entries = records[index];
    indices = region.groups;
  } else if (region) {
    title = region.label[language];
    entries = region.groups.flatMap(group=>records[group]);
    indices = region.groups;
  } else if (view==='all') {
    title = t().all;
  } else {
    indices = catalog.map((_,i)=>i);
  }
  renderBreadcrumb(title,searching);
  get('heading').textContent = title;
  get('count').textContent = t().count(entries.length);
  const results = get('results');
  results.replaceChildren();
  matching = entries;
  rendered = 0;
  if (indices.length) results.append(categoryPicker(indices));
  if (view==='home' && !searching) {
    const tools = el('div','panel-tools');
    tools.append(action(t().all,'all','control'));
    results.append(tools);
    return;
  }
  if (!entries.length) {
    results.append(el('p','empty',view==='favorites'&&!searching?t().emptyFav:t().empty));
    return;
  }
  const list = el('ul','resource-list');
  list.id = 'resourceList';
  const more = el('button','control more',t().more);
  more.id = 'more';
  more.type = 'button';
  results.append(list,more);
  appendPage();
}
function resetResults() {
  cancelAnimationFrame(pendingSearch);
  renderResults();
}
function renderRoute() {
  const atEntrance = view==='landing';
  get('landing').hidden = !atEntrance;
  get('directory').hidden = atEntrance;
  get('favorites').hidden = atEntrance;
  syncMap();
  if (!atEntrance) resetResults();
}
function go(next,{focus=false}={}) {
  const enteredDirectory = view==='landing' && next!=='landing';
  get('search').value = '';
  view = next;
  if (routeFromHash()!==next) history.pushState(null,'',next==='landing'?'#':'#'+next);
  renderRoute();
  if (focus) get(next==='landing'?'landingTitle':'heading').focus({preventScroll:enteredDirectory});
  if (enteredDirectory || next==='landing') window.scrollTo(0,0);
}
function renderLanguage() {
  const text = t();
  document.documentElement.lang = text.lang;
  document.title = text.footer;
  get('language').value = String(language);
  get('brandName').textContent = get('heroTitle').textContent = get('landingTitle').textContent = text.brand;
  const entrance = landingCopy[language];
  get('landingIntro').textContent = entrance.intro;
  get('releaseLinkText').textContent = entrance.releaseLink;
  get('releaseTitle').textContent = entrance.releaseTitle;
  get('releaseIntro').textContent = entrance.releaseIntro;
  get('releaseNotes').replaceChildren(...entrance.notes.map(note=>el('li','',note)));
  get('guideTitle').textContent = entrance.guideTitle;
  get('guideIntro').textContent = entrance.guideIntro;
  get('sectionGuide').replaceChildren(...regions.map((region,index)=>{
    const item = el('li');
    const title = el('strong');
    const icon = el('span','guide-icon',region.icon);
    icon.setAttribute('aria-hidden','true');
    title.append(icon,region.label[language]);
    const groups = el('div','guide-categories');
    groups.append(...region.groups.map(group=>el('span','',catalog[group].label[language])));
    item.append(title,el('p','',entrance.guide[index]),groups);
    return item;
  }));
  get('startTitle').textContent = entrance.startTitle;
  get('startIntro').textContent = entrance.startIntro;
  get('enterText').textContent = get('portalEnterText').textContent = entrance.enter;
  get('intro').textContent = text.intro;
  get('search').placeholder = text.search;
  get('search').setAttribute('aria-label',text.search);
  get('mapTitle').textContent = text.map;
  get('mapCount').textContent = text.count(all.length);
  get('mapNote').textContent = text.note;
  get('favoritesLabel').textContent = text.favorites;
  get('favorites').setAttribute('aria-label',text.favorites);
  get('breadcrumb').setAttribute('aria-label',text.trail);
  get('footerText').textContent = text.footer;
  renderMap();
  renderRoute();
}

get('language').addEventListener('change',event=>{
  language = Number(event.target.value);
  persist('lang',language);
  renderLanguage();
});
get('brand').addEventListener('click',event=>{
  event.preventDefault();
  go('landing',{focus:true});
});
get('favorites').addEventListener('click',()=>go(view==='favorites'?'home':'favorites',{focus:true}));
get('search').addEventListener('input',()=>{
  cancelAnimationFrame(pendingSearch);
  pendingSearch = requestAnimationFrame(()=>{
    renderResults();
  });
});
get('search').addEventListener('keydown',event=>{
  if (event.key==='Enter') get('heading').focus();
});
document.addEventListener('click',event=>{
  const route = event.target.closest('[data-route]');
  if (route) {
    go(route.dataset.route,{focus:true});
    return;
  }
  if (event.target.id==='more') {
    appendPage()?.querySelector('a').focus();
    return;
  }
  const button = event.target.closest('[data-favorite]');
  if (!button) return;
  const host = button.dataset.favorite;
  if (favorites.has(host)) favorites.delete(host);
  else favorites.add(host);
  persist('favorites',[...favorites]);
  if (view==='favorites') {
    const buttons = Array.from(get('results').querySelectorAll('[data-favorite]'));
    const neighbor = buttons[buttons.indexOf(button)+1] ?? buttons[buttons.indexOf(button)-1];
    renderResults();
    const replacement = Array.from(get('results').querySelectorAll('[data-favorite]'))
      .find(item=>item.dataset.favorite===neighbor?.dataset.favorite);
    (replacement ?? get('heading')).focus();
  } else {
    updateFavoriteButton(button,entriesByHost.get(host));
  }
});
window.addEventListener('popstate',()=>{
  view = routeFromHash();
  get('search').value = '';
  renderRoute();
});
renderLanguage();
</script>
</body>
</html>
